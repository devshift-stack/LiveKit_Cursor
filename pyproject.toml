[project]
name = "amina"
version = "0.2.0"
description = "Amina — Aquaphor Smile BiH voice agent (LiveKit)"
requires-python = ">=3.11"
dependencies = [
  "livekit-agents[fishaudio,deepgram,openai,silero]~=1.6",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: needs live LLM / LiveKit credentials",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amina"]
